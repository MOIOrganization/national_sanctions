name: sanctions
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1


environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  generate: true
  uses-material-design: true

  assets:
    - asset/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/images/appicon.png"
  remove_alpha_ios: true 

  web:
    generate: true
    image_path: "asset/images/appicon.png"
    background_color: "#FFFFFF"
    theme_color: "#0D2748"